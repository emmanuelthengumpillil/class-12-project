<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
            {% endblock title %}
        </title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <div class="flex">
            <aside class="sticky top-0 flex h-screen w-64 flex-shrink-0 flex-col bg-zinc-50 p-2 text-zinc-900">
                <div class="sticky top-0 z-10 pb-2">
                    <h1 class="rounded-lg px-5 py-2 text-lg font-semibold">CRM</h1>
                </div>
                <div class="flex flex-1 flex-col gap-2 py-2">
                    <div class="flex flex-col gap-1 rounded-lg border border-zinc-200 px-5 py-2 hover:bg-zinc-200">
                        <a class="font-normal text-zinc-900" href="/">Home</a>
                    </div>
                    <div class="flex flex-col gap-1 rounded-lg border border-zinc-200 px-5 py-2 hover:bg-zinc-200">
                        <a class="font-normal text-zinc-900" href="/customers">Customers</a>
                    </div>
                </div>
                <div class="sticky bottom-0 z-10 gap-1 rounded-lg border border-zinc-200 px-5 py-2 hover:bg-zinc-200">
                    <a class="font-normal text-zinc-900" href="/user">{{ username }}</a>
                </div>
            </aside>

            {% block content %}
            {% endblock content %}

        </div>
    </body>
</html>
