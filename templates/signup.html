{% extends "base_crm_2.html" %}

{% block title %}
    Zerohour - Sign Up
{% endblock title %}

{% block content %}
    <div class="flex flex-1 items-center justify-center h-screen">
        <div class="border border-zinc-300 shadow-xl px-8 py-10 rounded-2xl flex flex-col gap-4">
            <div class="text-center">
                <h1 class="font-medium text-3xl">Create your CRM enterprise account</h1>
            </div>
            <form action="/signup" method="post" class="flex flex-col gap-7">
                <div class="flex flex-col gap-3">
                    <div class="flex flex-col">
                        <label>Name</label>
                        <input required type="text" name="name" placeholder="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="flex flex-col">
                        <label>Phone</label>
                        <input required type="text" name="phone" placeholder="9876543210" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="flex flex-col">
                        <label>Email</label>
                        <input required type="email" name="email" placeholder="name@example.com" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="flex flex-col">
                        <label>Company name</label>
                        <input type="text" name="company_name" placeholder="EA groups inc" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="flex flex-col">
                        <label>Password</label>
                        <input required type="password" placeholder="Password" name="password" class="px-2 h-8 border border-zinc-300 rounded-md">
                    </div>
                </div>
                {% if message %}
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                        <strong class="font-bold">{{ message }}</strong>
                    </div>
                {% endif %} 
                <button type="submit" class="text-white bg-blue-500 cursor-pointer hover:bg-blue-600 rounded-md shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Sign Up</button>
            </form>
        </div>
    </div>
{% endblock content %}
